services:
  app:
    build: .
    environment:
      AEROMIND_MOCK_MODE: "true"
      AEROMIND_DATABASE_URL: postgresql+psycopg://aeromind:aeromind@postgres:5432/aeromind
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: aeromind
      POSTGRES_USER: aeromind
      POSTGRES_PASSWORD: aeromind
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeromind -d aeromind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
