[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aeromind"
version = "0.1.0"
description = "Simulation-only agentic AI platform foundation for autonomous drone mission operations."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AeroMind Contributors" }]
dependencies = [
  "alembic>=1.13,<2.0",
  "fastapi>=0.115,<1.0",
  "langchain-core>=0.3,<2.0",
  "langgraph>=0.2,<2.0",
  "pgvector>=0.3,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.6,<1.0",
]
observability = ["langsmith>=0.1,<1.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/aeromind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["aeromind"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aeromind"]
warn_unreachable = true
